<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{description}">
  <meta name="author" content="{author}">
  <meta name="theme-color" content="{night}">
  <meta property="og:title" content="{title} — {author}">
  <meta property="og:description" content="{baseline}">
  <meta property="og:type" content="book">
  <meta property="og:image" content="{social_image}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{social_alt}">
  <meta property="book:author" content="{author}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{title} — {author}">
  <meta name="twitter:description" content="{baseline}">
  <meta name="twitter:image" content="{social_image}">
  <meta name="twitter:image:alt" content="{social_alt}">
  <title>{title} — {author}</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="palette.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <h1>{title_html}</h1>
        <p class="hero-author"><a href="{author_url}">{author}</a></p>
        <p class="baseline">{baseline_html}</p>
      </div>
      <div class="quote-wrap">
        <blockquote><p>{citation}</p></blockquote>
      </div>
    </div>
  </header>

  <main>
    <section class="synopsis">
      {story_header}
      <div class="prose">{story}</div>
    </section>

    <section class="resonance">
      {resonance_header}
      <ol class="themes">{themes}</ol>
      <a class="universal" href="{universal_url}">{universal}</a>
      <a class="text-link" href="{study_url}">{study}</a>
    </section>

    <section class="references">
      {references_header}
      <div class="book-list">{reference_notes}{books}</div>
    </section>

  </main>

  <footer>
    <a class="action-button" href="{action_url}"><span>{action}</span></a>
    <p class="copyright">{copyright}</p>
  </footer>
</body>
</html>
